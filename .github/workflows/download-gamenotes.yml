name: Download NBA Game Notes (hourly)

on:
  schedule:
    # Runs every hour (UTC)
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: download-gamenotes
  cancel-in-progress: true

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Install required R packages
        run: |
          Rscript -e 'install.packages("curl", repos="https://cloud.r-project.org")'

      - name: Run game notes downloader
        run: |
          Rscript scripts/download_gamenotes.R

      - name: Commit and push updated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add nba_game_notes/*.pdf || true

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update NBA game notes PDFs"
            git push
          fi
